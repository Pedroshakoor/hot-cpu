name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stress-test scene
        run: node test_scene.cjs
      - name: Build universal native app
        run: ./mac/build-mac.sh
      - name: Verify app signature and bundle
        run: |
          codesign --verify --deep --strict --verbose=2 build/HotCPU.app
          plutil -lint build/HotCPU.app/Contents/Info.plist
          lipo -archs build/HotCPU.app/Contents/MacOS/HotCPU
      - name: Package app
        run: ./mac/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: HotCPU-macOS
          path: dist/
